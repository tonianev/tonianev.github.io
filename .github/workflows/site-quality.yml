name: Site Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint HTML
        run: npx --yes htmlhint@latest "./*.html"

      - name: Check JS syntax
        run: node --check site.js

      - name: Check Links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn returns HTTP 999 to non-browser clients; exclude it.
          args: --verbose --no-progress --accept 200,429 --exclude "^https://tonianev\\.com/.*" --exclude "^https://(www\\.)?linkedin\\.com" "./*.html"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
